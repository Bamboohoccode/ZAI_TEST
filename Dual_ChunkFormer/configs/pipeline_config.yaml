# Dual-Chunkformer + Qwen code-switching ASR pipeline

models:
  chunkformer_vi: khanhld/chunkformer-ctc-large-vie        # HF id hoặc thư mục local (có config.yaml, pytorch_model.bin, vocab.txt)
  chunkformer_en: khanhld/chunkformer-large-en-libri-960h  # kiểm tra lại id này / thay bằng ckpt English của bạn
  vi_ckpt: null            # .pt/.bin fine-tuned nạp đè lên chunkformer_vi (state_dict của model.model)
  en_ckpt: null
  qwen: Qwen/Qwen3.5-0.6B  # HF id hoặc thư mục local
  qwen_lora: null          # thư mục adapter LoRA (SFT hoặc GRPO)
  vi_device: cuda:0
  en_device: cuda:0        # đặt cuda:1 nếu có 2 GPU để 2 model chạy song song thật sự
  qwen_device: cuda:0

chunkformer:
  chunk_size: 64
  left_context_size: 128
  right_context_size: 128

ctc:
  temperature_vi: 1.0      # T_vi, ghi đè bởi calibration_file nếu có
  temperature_en: 1.0      # T_en
  conf_threshold: 0.6      # word có confidence < ngưỡng thì là uncertain
  conf_agg: min            # min | mean: gộp confidence các token trong một word
  merge_gap_words: 0       # gộp 2 span uncertain cách nhau <= N word tin cậy
  max_span_words: 6        # span dài hơn thì cắt, tránh slot quá lớn
  pad_ms: 160              # cửa sổ En = [t_start - pad, t_end + pad]
  beam_size: 8             # CTC prefix beam search
  n_best: 4                # số candidate mỗi ngôn ngữ mỗi slot
  prune_topk: 12           # chỉ xét top-k token mỗi frame
  calibration_file: configs/calibration.json   # do train/calibrate_ctc.py sinh ra

qwen:
  mode: generate           # generate (sinh JSON) | score (chọn candidate bằng log-prob, constrained)
  max_new_tokens: 128
  score_length_norm: true

sft:
  epochs: 3
  batch_size: 8
  grad_accum: 2
  lr: 2.0e-4
  max_len: 768
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

grpo:
  lr: 1.0e-5
  beta: 0.04
  num_generations: 8
  max_completion_length: 128
  batch_size: 8
  grad_accum: 2
  epochs: 1
  reward_weights: {format: 0.2, wer: 1.0, anti_overcorrection: 0.5}
